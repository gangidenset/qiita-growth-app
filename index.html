<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a8a1c">
  <title>Qiita Growth</title>
  <meta name="description" content="自分の Qiita 記事の下書きの確認・承認を行う個人用ツール。ログインは github.com の公式画面で行います。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Qiita Growth</h1>
    <button id="reload" class="ghost" aria-label="再読み込み">↻</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="画面の切り替え">
    <button data-tab="articles" id="tabbtn-articles" role="tab" aria-controls="tab-articles" aria-selected="true" class="active">記事</button>
    <button data-tab="request" id="tabbtn-request" role="tab" aria-controls="tab-request" aria-selected="false" tabindex="-1">依頼</button>
    <button data-tab="settings" id="tabbtn-settings" role="tab" aria-controls="tab-settings" aria-selected="false" tabindex="-1">設定</button>
  </nav>

  <main>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

    <section id="tab-articles" role="tabpanel" aria-labelledby="tabbtn-articles"></section>

    <section id="tab-request" role="tabpanel" aria-labelledby="tabbtn-request" hidden>
      <h2>記事を書いてもらう</h2>
      <p class="muted">書いてほしいこと（テーマ・自分の体験・使った技術など）を書いて保存すると、<code>data/requests/</code> に依頼が残ります。Claude Code に「data/requests の依頼を実行して」と頼んでください。</p>
      <label>依頼の内容<textarea id="r-memo" rows="8" placeholder="例: Claude Code で PWA を作ったときに、Service Worker のキャッシュで古い画面が出続けた話。原因と直し方を書いてほしい"></textarea></label>
      <div class="row"><button id="r-save">依頼を保存</button></div>
    </section>

    <section id="tab-settings" role="tabpanel" aria-labelledby="tabbtn-settings" hidden>
      <h2>設定</h2>
      <p id="s-login-status" class="title"></p>
      <div class="row">
        <button id="s-login">GitHub でログイン</button>
        <button id="s-logout" class="danger" hidden>ログアウト</button>
      </div>
      <p class="muted">ボタンを押すと github.com の公式のログイン画面に移ります。このアプリの画面でパスワードや鍵を入力することはありません。Qiita のトークンもこのアプリには入れません（GitHub の Secrets にだけ置きます）。</p>
      <label>リポジトリ <input id="s-repo" type="text" placeholder="gangidenset/qiita-growth-team"></label>
      <label>ブランチ（空欄なら既定ブランチ。自動投稿は main だけで動きます）<input id="s-branch" type="text"></label>
      <label>承認者名（承認記録に残る名前）<input id="s-approver" type="text" placeholder="owner"></label>
      <div class="row"><button id="s-save">保存して読み込む</button></div>
      <p id="s-version" class="meta"></p>
    </section>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
